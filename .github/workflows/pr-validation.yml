name: Customer School PR validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-school-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-core:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix backend ci
          npm --prefix frontend ci
      - name: Build and verify physical clean core
        run: |
          npm run build:core
          npm run verify:core
          npm run test:core
          npm --prefix backend run typecheck
      - name: Audit production dependency trees
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix backend audit --audit-level=high
          npm --prefix backend audit --omit=dev --audit-level=high
          npm --prefix frontend audit --audit-level=high

  plugin-host-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend
        run: npm --prefix backend ci
      - name: Verify atomic lifecycle, isolation, rollout, SDK and universal UI contracts
        working-directory: backend
        run: npm run test:plugin-host
      - name: Verify Customer School has no implicit official-plugin source dependency
        run: npm run verify:plugin-boundary
      - name: Verify source-independent recovery contracts
        working-directory: backend
        run: node --test scripts/plugin-source-root.test.js scripts/plugin-recovery-contract.test.js scripts/restore-recovery-set.test.js

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.29.1
