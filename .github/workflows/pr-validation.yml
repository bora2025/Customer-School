name: Customer School PR validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-school-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-core:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix backend ci
          npm --prefix frontend ci
      - name: Build and verify physical clean core
        env:
          # Same traced-dependency layout as frontend/Dockerfile.core, so the audit below sees
          # exactly the packages the core web image ships.
          CORE_BUILD_NODE_MODULES_MODE: copy
        run: |
          npm run build:core
          npm run verify:core
          npm run test:core
          npm --prefix backend run typecheck
      - name: Audit production dependency trees
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix backend audit --audit-level=high
          npm --prefix backend audit --omit=dev --audit-level=high
          npm run audit:core
      # Legacy-full frontend code (e.g. the card designer) is not in the core image. Keep its
      # advisories visible until goal G4 deletes it, without blocking core releases.
      - name: Audit full legacy frontend tree (informational)
        continue-on-error: true
        run: npm --prefix frontend audit --audit-level=high

  plugin-host-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend
        run: npm --prefix backend ci
      - name: Verify atomic lifecycle, isolation, rollout, SDK and universal UI contracts
        working-directory: backend
        run: npm run test:plugin-host
      - name: Verify Customer School has no implicit official-plugin source dependency
        run: npm run verify:plugin-boundary
      - name: Verify source-independent recovery contracts
        working-directory: backend
        run: node --test scripts/plugin-source-root.test.js scripts/plugin-recovery-contract.test.js scripts/restore-recovery-set.test.js

  # The per-plugin database role boundary, proven against real PostgreSQL (the major version schools
  # run) connected as a superuser, as hosted school databases are. A mocked Prisma cannot show that
  # PostgreSQL actually refuses a plugin's comma join into core tables, dynamic SQL or file reads.
  plugin-database-roles-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: plugin_roles
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend
        run: npm --prefix backend ci
      - name: Plugin statements cannot leave their own tables
        working-directory: backend
        env:
          PLUGIN_ROLES_DATABASE_URL: postgresql://postgres:ci-only-throwaway@localhost:5432/plugin_roles
        run: npx jest --runInBand src/plugins/plugin-database-roles.postgres.spec.ts

  # Plugin-owned screens run in a sandboxed iframe. This proves, in a real browser, that the bridge
  # works and that the screen cannot reach the network, school cookies, storage or DOM, or another
  # API path than its own plugin's.
  plugin-ui-sandbox-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm --prefix frontend ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Sandboxed plugin screen cannot escape; sidebar persists across navigation
        working-directory: frontend
        run: npx playwright test --config playwright.plugin-ui.config.ts plugin-ui-app-sandbox sidebar-persistence --project=desktop

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.29.1
