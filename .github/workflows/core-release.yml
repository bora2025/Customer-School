name: Signed core release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer release version
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-sign-blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.core
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/wattanam-customer-school-backend:${{ inputs.version }}
      - id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile.core
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/wattanam-customer-school-web:${{ inputs.version }}
      - id: gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/gateway/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/wattanam-customer-school-gateway:${{ inputs.version }}
      - name: Sign immutable images
        env:
          BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/wattanam-customer-school-backend@${{ steps.backend.outputs.digest }}
          WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/wattanam-customer-school-web@${{ steps.web.outputs.digest }}
          GATEWAY_IMAGE: ghcr.io/${{ github.repository_owner }}/wattanam-customer-school-gateway@${{ steps.gateway.outputs.digest }}
        run: |
          cosign sign --yes "$BACKEND_IMAGE"
          cosign sign --yes "$WEB_IMAGE"
          cosign sign --yes "$GATEWAY_IMAGE"
      - name: Generate and verify signed release blueprint
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/wattanam-customer-school-backend@${{ steps.backend.outputs.digest }}
          WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/wattanam-customer-school-web@${{ steps.web.outputs.digest }}
          GATEWAY_IMAGE: ghcr.io/${{ github.repository_owner }}/wattanam-customer-school-gateway@${{ steps.gateway.outputs.digest }}
          POSTGRES_IMAGE: postgres:18-alpine
        run: |
          node tools/generate-core-release-blueprint.js core-release-blueprint.json
          node tools/verify-core-image-signatures.js --blueprint core-release-blueprint.json
      - uses: actions/upload-artifact@v4
        with:
          name: core-release-${{ inputs.version }}
          path: core-release-blueprint.json
          if-no-files-found: error
          retention-days: 90
